<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet plates - Recettes</title>

    <style>
        .star {
  color: #ccc;
  cursor: pointer;
  font-size: 30px;
  background: none;
  border: none;
  transition: 0.2s;
}

.star.filled {
  color: #ff4f87;
}

.star:hover {
  transform: scale(1.15);
}


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            text-align: center;
            padding: 20px 15px;
        }

        header h3 {
            font-size: clamp(26px, 5vw, 40px);
            color: #e44379d2;
        }

        main {
            width: 100%;
            padding: 20px 5%;
        }

        /* FILTRES */
        .filter-section {
            width: min(100%, 1200px);
            margin: 0 auto 40px;
            padding: 0;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gray);
            margin-right: 8px;
        }

        .filter-btn {
            background: none;
            border: 1px solid rgba(245, 56, 128, 0.12);
            color: rgba(255, 74, 159, 0.8);
            padding: 10px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 5px;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: #c9a84c;
            color: #c9a84c;
            background: rgba(221, 31, 142, 0.06);
        }

        /* Grille créée par recette.js */
        #recipesGrid {
            width: min(100%, 1200px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .recipe-card {
            min-width: 0;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .recipe-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            position: relative;
        }

        .recipe-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .recipe-info {
            padding: 20px;
        }

        .recipe-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .recipe-info p {
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .recipe-info button {
            width: 100%;
            padding: 11px 15px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #e44379d2;
            color: white;
            cursor: pointer;
        }

        /* TABLETTE */
        @media (max-width: 1024px) {
            main {
                padding: 20px 4%;
            }

            #recipesGrid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 20px;
            }

            .filter-section {
                gap: 10px;
            }
        }

        /* TELEPHONE */
        @media (max-width: 600px) {
            header {
                padding: 15px 10px;
            }

            main {
                padding: 15px 4%;
            }

            .filter-section {
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }

            .filter-btn {
                width: 100%;
                max-width: 350px;
            }

            #recipesGrid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .recipe-info {
                padding: 16px;
            }
        }

        /* PETIT TELEPHONE */
        @media (max-width: 400px) {
            .recipe-info h3 {
                font-size: 18px;
            }

            .recipe-info p {
                font-size: 14px;
            }
        }

        /* Grille 4 colonnes pour les produits */
.products-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
}

/* Carte produit */
.product-card { position: relative; cursor: none; overflow: hidden; }

.product-img {
  aspect-ratio: 3 / 4; background: var(--dark-gray);
  position: relative; overflow: hidden; margin-bottom: 20px;
}

/* Lettre décorative centrale */
.product-img-inner {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cormorant Garamond', serif; font-size: 60px;
  color: rgba(201,168,76,0.08); letter-spacing: 0.1em;
  transition: transform 0.6s;
}
.product-card:hover .product-img-inner { transform: scale(1.05); }

/* Overlay sombre avec bouton au survol */
.product-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10,10,10,0.8) 0%, transparent 50%);
  opacity: 0; transition: opacity 0.4s;
  display: flex; align-items: flex-end; padding: 24px;
}
.product-card:hover .product-overlay { opacity: 1; }

.product-quick-add {
  width: 100%; background: var(--gold); color: var(--black);
  border: none; padding: 12px;
  font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
  font-family: 'Montserrat', sans-serif; font-weight: 500;
  cursor: none; transition: background 0.3s;
}
.product-quick-add:hover { background: var(--gold-light); }
h1 {
    margin-bottom: 20px;
}
button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #c9a84c;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: rgb(174, 149, 100);
}

      .product-card {

      .product-brand {

      }

      .recipes-section{

    }

    }

    }

        .view-recipe{
            width:100%;
            border:0;
            border-radius:8px;

        }

                background:#d83d77
            }
            .empty{

            }
.recipe-modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#0009
}
.recipe-modal.show{
    display:flex
}
.recipe-modal-content{
    position:relative;
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:20px
}
.recipe-close{
    position:absolute;
    right:14px;
    top:14px;
    z-index:2;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#fff;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 3px 12px #0003
}
.detail-hero{
    display:grid;
    grid-template-columns:42% 58%
}
.detail-hero img{
    width:100%;
    height:100%;
    min-height:300px;
    object-fit:cover
}
.detail-intro{
    padding:35px
}
.detail-category{
    display:inline-block;
    background:#fff0f6;
    color:#d83d77;
    padding:6px 11px;
    border-radius:20px;
    font-size:12px
}
.detail-intro h2{
    font-size:34px;
    margin:14px 0 10px
}
.detail-description{
    color:#667085;
    line-height:1.6;
    margin-bottom:20px
}
.detail-meta{
    display:flex;
    flex-wrap:wrap;
    gap:9px
}
.detail-meta span{
    background:#fff0f6;
    padding:9px;
    border-radius:8px;
    font-size:13px
}
.rating-section{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px
}
.rating-label{
    font-size:13px;
    font-weight:600;
    color:#667085
}
.star-rating{
    display:inline-flex;
    gap:2px
}
.star{
    background:none;
    border:0;
    padding:2px;
    font-size:26px;
    line-height:1;
    color:#ddd;
    cursor:pointer;
    transition:color .15s, transform .15s
}
.star:hover,
.star:focus-visible{
    transform:scale(1.15)
}
.star.hovered{
    color:#ffb6d1
}
.star.filled{
    color:#f7498c
}
.rating-feedback{
    font-size:12px;
    color:#667085
}
.favorite-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:36px;
    height:36px;
    border-radius:50%;
    border:0;
    background:rgba(255,255,255,.9);
    color:#999;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:color .2s, transform .15s;
    box-shadow:0 2px 8px #00000026
}
.favorite-btn:hover{
    transform:scale(1.12)
}
.favorite-btn.active{
    color:#f7498c
}
.detail-hero{
    position:relative
}
.modal-favorite{
    top:14px;
    left:14px;
    right:auto
}
.filter-btn.favorites-filter{
    color:#f7498c;
    border-color:rgba(247,73,140,.35)
}
.filter-btn.favorites-filter:hover,
.filter-btn.favorites-filter.active{
    border-color:#f7498c;
    color:#fff;
    background:#f7498c
}
.detail-body{
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:35px;
    padding:30px 35px 40px;
    border-top:1px solid #eee
}
.detail-body h3{
    color:#d83d77;
    margin-bottom:15px
}
.detail-body ul{
    padding-left:20px;
    line-height:1.8
}
.detail-steps{
    list-style:none!important;
    padding:0!important;
    display:grid;
    gap:12px
}
.detail-steps li{
    display:flex;
    gap:12px;
    line-height:1.5
}
.detail-steps b{
    flex:none;
    display:grid;
    place-items:center;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#f7498c;
    color:#fff
}

 /* Boutons d'action (accueil) */
        .top-actions {
            display: flex;

        }

                }
                }
